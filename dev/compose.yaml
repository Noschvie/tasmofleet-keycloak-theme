# Development Keycloak for theme work. Not for production.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${KC_DEV_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ../theme/tasmofleet:/opt/keycloak/themes/tasmofleet:ro
      - ./realm-tasmofleet-test.json:/opt/keycloak/data/import/realm-tasmofleet-test.json:ro
